version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: skillswap-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: skill-swap
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skillswap-api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/skill-swap
      JWT_SECRET: super_secure_production_secret_key_skillswap_2026
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: skillswap-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
